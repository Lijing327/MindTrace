<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="graphPageTitle">MindTrace — Thought Universe</title>
    <link rel="stylesheet" href="graph/graph.css?v=4.6.0" />
  </head>
  <body class="cosmos-body">
    <div id="root">
      <div class="cosmos-app cosmos-app--static">
        <header class="cosmos-header">
          <div class="cosmos-header-brand">
            <span class="cosmos-header-icon" aria-hidden="true">🌌</span>
            <div>
              <h1 class="cosmos-title" data-i18n="thoughtUniverse">Thought Universe</h1>
              <p class="cosmos-sub" data-i18n="cosmosDiscoverSub">Discover hidden connections between your ideas</p>
            </div>
          </div>
        </header>
        <div class="cosmos-body-grid">
          <aside class="cosmos-sidebar"></aside>
          <section class="cosmos-center">
            <div class="cosmos-overlay" aria-live="polite">
              <div class="cosmos-spinner"></div>
              <p class="cosmos-overlay-text" data-i18n="cosmosLoading">Loading Thought Universe…</p>
            </div>
          </section>
          <aside class="cosmos-detail"></aside>
        </div>
      </div>
    </div>
    <div id="graph-boot-error" class="graph-boot-error" hidden></div>

    <script src="src/utils/i18n.js"></script>
    <script>
      MindTraceI18n.applyPageI18n(document);
    </script>
    <script src="utils.js"></script>
    <script src="services/garden.service.js"></script>
    <script src="services/keyword.service.js"></script>
    <script src="services/similarity.service.js"></script>
    <script src="services/vector.service.js"></script>
    <script src="services/embedding-storage.service.js"></script>
    <script src="services/relation.service.js"></script>
    <script src="services/cluster.service.js"></script>
    <script src="services/theme-galaxy.service.js"></script>
    <script src="services/graph.service.js"></script>
    <script src="storage.js"></script>
    <script src="lib/graph.bundle.js?v=4.6.0"></script>
  </body>
</html>
