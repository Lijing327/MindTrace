<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="universePageTitle">MindTrace — Thought Universe</title>
    <link rel="stylesheet" href="universe.css" />
  </head>
  <body class="universe-body">
    <div class="universe-app">
      <header class="universe-header">
        <div class="universe-brand">
          <span class="universe-brand-icon" aria-hidden="true">✦</span>
          <div>
            <h1 class="universe-title" data-i18n="thoughtUniverse">Thought Universe</h1>
            <p class="universe-sub" data-i18n="universeSubtitle">Knowledge galaxies · Static preview</p>
          </div>
        </div>
      </header>

      <div class="universe-grid">
        <aside class="universe-sidebar" data-i18n-aria="themeGalaxy" aria-label="Theme Galaxy">
          <h2 class="universe-sidebar-title" data-i18n="themeGalaxy">Theme Galaxy</h2>
          <ul class="theme-list" id="theme-list"></ul>
        </aside>

        <main class="universe-canvas-wrap" data-i18n-aria="universeCanvasAria" aria-label="Universe map">
          <div class="universe-metrics">
            <div class="metric"><span class="metric-val">8</span><span class="metric-lbl" data-i18n="thoughtNodes">Thought nodes</span></div>
            <div class="metric"><span class="metric-val">6</span><span class="metric-lbl" data-i18n="themePlanets">Theme planets</span></div>
            <div class="metric"><span class="metric-val">14</span><span class="metric-lbl" data-i18n="energyLinks">Energy links</span></div>
            <div class="metric"><span class="metric-val">1</span><span class="metric-lbl" data-i18n="centralStar">Central star</span></div>
          </div>

          <div class="universe-stage" id="universe-stage">
            <div class="bg-nebula" aria-hidden="true"></div>
            <div class="bg-glow-spots" aria-hidden="true"></div>
            <div class="bg-stars" aria-hidden="true"></div>
            <div class="bg-dust" aria-hidden="true"></div>
            <div class="bg-vignette" aria-hidden="true"></div>

            <svg
              class="universe-links"
              id="universe-links"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <defs>
                <linearGradient id="link-grad-hub" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="rgba(120, 160, 255, 0.15)" />
                  <stop offset="45%" stop-color="rgba(160, 200, 255, 0.75)" />
                  <stop offset="100%" stop-color="rgba(100, 180, 255, 0.35)" />
                </linearGradient>
                <linearGradient id="link-grad-sub" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="rgba(90, 140, 255, 0.1)" />
                  <stop offset="50%" stop-color="rgba(130, 170, 255, 0.55)" />
                  <stop offset="100%" stop-color="rgba(80, 120, 220, 0.2)" />
                </linearGradient>
                <filter id="link-glow" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="3" result="blur" />
                  <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                  </feMerge>
                </filter>
              </defs>
            </svg>

            <div class="universe-nodes" id="universe-nodes"></div>
          </div>
        </main>

        <aside class="universe-detail" data-i18n-aria="themeDetailAria" aria-label="Theme detail">
          <p class="detail-tag" data-i18n="thoughtUniverse">Thought Universe</p>
          <h2 class="detail-title" id="detail-title"></h2>
          <span class="detail-badge" data-i18n="centralTheme">Central theme</span>
          <p class="detail-stats" id="detail-stats"></p>
          <p class="detail-desc" id="detail-desc"></p>

          <section class="detail-section">
            <h3 class="detail-section-title" data-i18n="keywords">Keywords</h3>
            <div class="detail-keywords" id="detail-keywords"></div>
          </section>

          <section class="detail-section">
            <h3 class="detail-section-title" data-i18n="strongestRelatedThemes">Strongest related themes</h3>
            <ul class="detail-related" id="detail-related"></ul>
          </section>

          <section class="detail-section">
            <h3 class="detail-section-title" data-i18n="recentThoughts">Recent Thoughts</h3>
            <ul class="detail-thoughts" id="detail-thoughts"></ul>
          </section>

          <a href="dashboard.html" class="detail-view-all" data-i18n="viewAllThoughts">View All Thoughts</a>
        </aside>
      </div>
    </div>

    <script src="src/utils/i18n.js"></script>
    <script src="universe.js"></script>
  </body>
</html>
